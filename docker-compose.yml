name: automation-platform

x-app-common: &app-common
  build:
    context: .
  env_file:
    - .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      APP_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER}
      APP_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD}
      APP_API_USER: ${POSTGRES_API_USER}
      APP_API_PASSWORD: ${POSTGRES_API_PASSWORD}
      APP_WORKER_USER: ${POSTGRES_WORKER_USER}
      APP_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD}
      APP_CONTROL_USER: ${POSTGRES_CONTROL_USER}
      APP_CONTROL_PASSWORD: ${POSTGRES_CONTROL_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app-common
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}

  api:
    <<: *app-common
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app-common
    command:
      ["celery", "-A", "automation_service.worker:celery_app", "worker", "--loglevel=INFO"]
    environment:
      DATABASE_URL: ${WORKER_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
